<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg_mlbb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E30"/>
      <stop offset="100%" stop-color="#090E18"/>
    </linearGradient>
    <linearGradient id="gold_mlbb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38EF7D"/>
      <stop offset="100%" stop-color="#11998E"/>
    </linearGradient>
    <linearGradient id="wings" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="url(#bg_mlbb)" stroke="#1E3A5F" stroke-width="2"/>
  
  <!-- Crest Wings & Diamond -->
  <g transform="translate(60, 48)">
    <polygon points="0,-22 18,0 0,22 -18,0" fill="url(#wings)" stroke="#93C5FD" stroke-width="2"/>
    <polygon points="0,-12 10,0 0,12 -10,0" fill="#E0F2FE"/>
    <circle cx="0" cy="0" r="3" fill="#2563EB"/>
  </g>

  <!-- MLBB Badge -->
  <rect x="18" y="86" width="84" height="22" rx="6" fill="url(#wings)"/>
  <text x="60" y="101" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">MLBB</text>
</svg>
