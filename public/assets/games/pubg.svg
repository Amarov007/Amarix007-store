<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg_pubg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2028"/>
      <stop offset="100%" stop-color="#0E0F14"/>
    </linearGradient>
    <linearGradient id="gold_pubg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="glow_pubg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="url(#bg_pubg)" stroke="#2C2E3D" stroke-width="2"/>
  <rect x="4" y="4" width="112" height="60" rx="20" fill="url(#glow_pubg)"/>
  
  <!-- Level 3 Helmet Icon & Visor -->
  <g transform="translate(60, 52)">
    <!-- Helmet Dome -->
    <path d="M-26,-8 C-26,-28 26,-28 26,-8 C26,10 20,22 14,24 L-14,24 C-20,22 -26,10 -26,-8 Z" fill="#2A2D3A" stroke="url(#gold_pubg)" stroke-width="2.5"/>
    <!-- Visor Guard -->
    <path d="M-22,-4 L22,-4 L20,8 L-20,8 Z" fill="#14151B" stroke="#F59E0B" stroke-width="1.8"/>
    <!-- Visor Slit -->
    <rect x="-16" y="0" width="32" height="3" rx="1.5" fill="#FCD34D"/>
    <!-- Cheeks protection -->
    <path d="M-24,4 L-18,18 L-8,21 L-10,6 Z" fill="#1F212B"/>
    <path d="M24,4 L18,18 L8,21 L10,6 Z" fill="#1F212B"/>
    <!-- Welded line -->
    <line x1="-12" y1="-24" x2="12" y2="-24" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- PUBG Text Badge -->
  <rect x="18" y="86" width="84" height="22" rx="6" fill="#F59E0B"/>
  <text x="60" y="101" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#0E0F14" text-anchor="middle" letter-spacing="1.2">PUBG MOBILE</text>
</svg>
