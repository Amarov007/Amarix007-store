name: Validate store scripts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run contract tests
        run: npm test
      - name: Build Vite application and type-check
        run: npm run build
      - name: Check browser JavaScript syntax
        run: |
          node --check app.js
          node --check admin.js
          node --check pay.js
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Edge Functions
        run: |
          deno check --node-modules-dir=none supabase/functions/smm-order/index.ts
          deno check --node-modules-dir=none supabase/functions/telegram-admin/index.ts
