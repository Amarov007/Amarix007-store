name: Replace Store Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wipe old files and extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in root!"
            exit 1
          fi
          echo "Found $ZIP_FILE"
          
          # الاحتفاظ بنسخة من ملف الـ ZIP وملف الـ CNAME مؤقتاً
          cp "$ZIP_FILE" /tmp/archive.zip
          if [ -f CNAME ]; then cp CNAME /tmp/CNAME_backup; fi
          
          # حذف جميع الملفات والمجلدات القديمة من المستودع
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          
          # فك ضغط الملف الجديد
          mkdir -p /tmp/extracted
          unzip -q /tmp/archive.zip -d /tmp/extracted
          
          # إذا كان الـ ZIP يحتوي على مجلد واحد بداخله، انقل محتوياته مباشرة للجذر
          DIR_COUNT=$(find /tmp/extracted -mindepth 1 -maxdepth 1 | wc -l)
          FIRST_ITEM=$(find /tmp/extracted -mindepth 1 -maxdepth 1 | head -n 1)
          if [ "$DIR_COUNT" -eq 1 ] && [ -d "$FIRST_ITEM" ]; then
            shopt -s dotglob
            mv "$FIRST_ITEM"/* .
          else
            shopt -s dotglob
            mv /tmp/extracted/* .
          fi
          
          # استرجاع ملف الـ CNAME إن لم يكن موجوداً في الـ ZIP
          if [ -f /tmp/CNAME_backup ] && [ ! -f CNAME ]; then
            cp /tmp/CNAME_backup CNAME
          fi
          
          # إعداد Git وحفظ التغييرات
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace repository with uploaded ZIP contents" || echo "No changes to commit"
          git push
