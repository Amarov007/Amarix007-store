name: Replace Store Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wipe old files and extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found!"
            exit 1
          fi
          echo "Found ZIP file: $ZIP_FILE"
          cp "$ZIP_FILE" /tmp/archive.zip
          if [ -f CNAME ]; then cp CNAME /tmp/CNAME_backup; fi
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          mkdir -p /tmp/extracted
          unzip -q -o /tmp/archive.zip -d /tmp/extracted
          rm -rf /tmp/extracted/__MACOSX
          DIR_COUNT=$(find /tmp/extracted -mindepth 1 -maxdepth 1 | wc -l)
          FIRST_ITEM=$(find /tmp/extracted -mindepth 1 -maxdepth 1 | head -n 1)
          if [ "$DIR_COUNT" -eq 1 ] && [ -d "$FIRST_ITEM" ]; then
            cp -rf "$FIRST_ITEM"/. .
          else
            cp -rf /tmp/extracted/. .
          fi
          rm -rf /tmp/extracted /tmp/archive.zip
          if [ -f /tmp/CNAME_backup ] && [ ! -f CNAME ]; then
            cp /tmp/CNAME_backup CNAME
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace repository with Amarix007-store-fixed.zip" || echo "No changes"
          git push
