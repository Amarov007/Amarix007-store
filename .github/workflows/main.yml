name: Unzip Files
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract ZIP and remove archive
        run: |
          for z in *.zip; do
            if [ -f "$z" ]; then
              unzip -o "$z"
              rm "$z"
            fi
          done
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Auto extract ZIP" && git push)
