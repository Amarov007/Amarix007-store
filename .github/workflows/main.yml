name: Unzip Inner Folder Safely
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract files ignoring .github folder
        run: |
          shopt -s dotglob nullglob
          for z in *.zip; do
            if [ -f "$z" ]; then
              mkdir -p /tmp/extracted
              unzip -q -o "$z" -d /tmp/extracted
              rm -f "$z"
              
              items=(/tmp/extracted/*)
              if [ ${#items[@]} -eq 1 ] && [ -d "${items[0]}" ]; then
                src="${items[0]}"
              else
                src="/tmp/extracted"
              fi
              
              # حذف مجلد .github من الملفات المستخرجة حتى لا يرفض GitHub عملية الرفع
              rm -rf "$src/.github"
              rm -rf "$src/.git"
              
              cp -rf "$src"/* .
              rm -rf /tmp/extracted
            fi
          done
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Extract project files to root" && git push)
