name: Security contract tests

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [security/amarix-hardening-2026-10]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run security contract tests
        run: npm test
