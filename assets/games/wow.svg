<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg_wow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C2E"/>
      <stop offset="100%" stop-color="#0A0B14"/>
    </linearGradient>
    <linearGradient id="gold_wow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <radialGradient id="ring_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB300" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFB300" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="url(#bg_wow)" stroke="#303550" stroke-width="2"/>
  <circle cx="60" cy="50" r="42" fill="url(#ring_glow)"/>
  
  <!-- Outer Ornate Ring -->
  <circle cx="60" cy="50" r="30" fill="none" stroke="url(#gold_wow)" stroke-width="3" stroke-dasharray="8 3"/>
  <circle cx="60" cy="50" r="24" fill="#121320" stroke="#FFB300" stroke-width="1.5"/>

  <!-- Ornate "W" Insignia -->
  <g transform="translate(60, 50)" fill="url(#gold_wow)">
    <path d="M-18,-14 L-11,14 L-4,-4 L0,4 L4,-4 L11,14 L18,-14 L12,-14 L8,4 L4,-10 L-4,-10 L-8,4 L-12,-14 Z"/>
    <circle cx="0" cy="-15" r="2.5" fill="#FFE082"/>
    <polygon points="0,17 -3,12 3,12" fill="#FFE082"/>
  </g>

  <!-- WOW Badge -->
  <rect x="22" y="86" width="76" height="22" rx="6" fill="url(#gold_wow)"/>
  <text x="60" y="101" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#0A0B14" text-anchor="middle" letter-spacing="1">WARCRAFT</text>
</svg>
