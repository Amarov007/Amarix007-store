<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self' https://pvuobngrybygohendwaz.supabase.co; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"><title>إدارة Amarix</title><link rel="stylesheet" href="styles.css"><script defer src="config.js"></script><script defer src="admin.js"></script></head><body><header class="top"><a class="brand" href="index.html">AMARIX<span>007</span></a><nav><a href="index.html">المتجر</a></nav></header><main id="admin" class="hero"><small>لوحة الإدارة</small><h1>إدارة المتجر</h1><p>منطقة محمية. سجّل الدخول بحساب الإدارة.</p><form id="admin-login" class="product"><label>البريد<input id="admin-email" type="email" required autocomplete="username"></label><label>كلمة المرور<input id="admin-password" type="password" required autocomplete="current-password"></label><button class="primary">دخول</button><p id="admin-msg"></p></form><section id="admin-panel" hidden><div class="section-head"><div><small>مركز التحكم</small><h2>ملخص المتجر</h2></div><button id="refresh-admin" class="secondary">تحديث البيانات</button></div><p id="admin-status" class="muted" aria-live="polite"></p><div class="products" id="stats"></div><h2>إضافة قسم</h2><form id="category-form" class="product admin-form"><label>اسم القسم<input id="cat-name" required maxlength="80"></label><label>المعرّف اللاتيني<input id="cat-slug" required pattern="[a-z0-9-]+" maxlength="60"></label><label>نوع القسم<select id="cat-kind"><option value="smm">خدمات الرشق</option><option value="numbers">أرقام التفعيل</option><option value="games">الألعاب</option><option value="apps">التطبيقات</option><option value="ai">الذكاء الاصطناعي</option><option value="custom">عام</option></select></label><button class="primary">إنشاء القسم</button></form><h2>الأقسام</h2><div id="admin-categories"></div><h2>إضافة منتج يدوي</h2><form id="product-form" class="product admin-form"><label>اسم المنتج<input id="prod-name" required maxlength="120"></label><label>القسم<select id="prod-category" required></select></label><label>السعر<input id="prod-price" type="number" min="0.01" step="0.01" required></label><label>العملة<select id="prod-currency"><option>USD</option><option>SYP</option><option>EUR</option></select></label><label>رابط الصورة (اختياري)<input id="prod-image" type="url"></label><label>الوصف<textarea id="prod-description" rows="2"></textarea></label><button class="primary">حفظ المنتج كمسودة</button></form><h2>المنتجات</h2><div id="admin-products"></div><h2>الطلبات الأخيرة</h2><div id="orders"></div><h2>المزوّدون</h2><div id="providers"></div><h2>طلبات شحن الرصيد</h2><div id="topups"></div></section></main></body></html>
