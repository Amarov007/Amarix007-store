<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم | AMARIX007</title>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8FAF9;--card:#fff;--tx:#0f1111;--mu:#565959;--bd:#e5e7eb;--g:#2F442C;--m:#A7E8BD;--ac:#52B788;--lk:#2D6A4F;--er:#ef4444}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--card:#1A1A1A;--tx:#f3f4f6;--mu:#9ca3af;--bd:#2a2a2a;--lk:#A7E8BD}}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font:14px/1.6 Alexandria,sans-serif;padding-bottom:60px}
button,input,select,textarea{font:inherit;color:inherit}a{color:inherit;text-decoration:none}
.w{max-width:1150px;margin:auto;padding:0 14px}.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 0}
.tr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.ttl{font-size:16px}.sp{flex:1}
.bdg{font-size:11px;padding:2px 10px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
.bdg.d{border-color:#FBBF24;color:#FBBF24}.bdg.k{border-color:var(--ac);color:var(--lk)}
.lay{display:grid;grid-template-columns:210px 1fr;gap:16px;margin-top:14px;align-items:start}
.sd{display:flex;flex-direction:column;gap:4px;position:sticky;top:70px}
.sd button{text-align:start;border:1px solid transparent;background:none;padding:9px 12px;border-radius:12px;cursor:pointer;color:var(--mu);font-weight:600}
.sd button:hover{background:var(--card)}.sd button.on{background:var(--g);color:var(--m);border-color:var(--ac)}
@media(max-width:800px){.lay{grid-template-columns:1fr}.sd{flex-direction:row;overflow-x:auto;position:static;padding-bottom:4px}.sd button{white-space:nowrap}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
h2{font-size:17px;margin-bottom:4px}h3{font-size:14px;margin-bottom:8px}
.hint{color:var(--mu);font-size:12px;margin-bottom:10px;line-height:1.7}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:600px){.g2,.g3{grid-template-columns:1fr}}
.fld{display:block;margin-bottom:10px;min-width:0}.fld>span{display:block;font-size:12px;color:var(--mu);margin-bottom:4px}
.w2{grid-column:1/-1}.inp{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;min-height:40px}
.inp:focus{outline:2px solid var(--ac)}textarea.inp{resize:vertical}
.col{padding:2px;height:40px;cursor:pointer}.chk{display:flex;gap:8px;align-items:center;margin-bottom:10px;cursor:pointer}
.b{background:var(--g);color:var(--m);border:1px solid var(--ac);border-radius:12px;padding:9px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.b:hover{filter:brightness(1.15)}.b:active{transform:scale(.97)}.b2{background:transparent;color:var(--lk)}
.bd2{background:transparent;color:var(--er);border-color:var(--er)}.sm{padding:5px 10px;font-size:12px;white-space:nowrap}
.it{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}.it:first-of-type{border-top:0}
.im{flex:1;min-width:0}.im b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.im small{color:var(--mu)}
.thm{width:48px;height:48px;border-radius:12px;background:var(--g);color:var(--m);border:1px solid var(--ac);display:inline-flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.thm img{width:100%;height:100%;object-fit:cover}
.dropzone{border:2px dashed var(--ac);border-radius:12px;padding:20px;text-align:center;background:var(--bg);cursor:pointer;transition:background .2s;margin-bottom:10px}
.dropzone:hover{background:color-mix(in srgb,var(--g) 10%,var(--bg))}
.grid-imgs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.grid-imgs .thm{position:relative}.grid-imgs .thm button{position:absolute;top:-6px;inset-inline-end:-6px;background:var(--er);color:#fff;border:0;border-radius:99px;width:20px;height:20px;font-size:12px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--lk)}.stat span{color:var(--mu);font-size:12px}
.tb{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
.tb th,.tb td{border-bottom:1px solid var(--bd);padding:8px;text-align:start}
.tb th{color:var(--mu);font-weight:400}
#ts{position:fixed;bottom:20px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--g);color:var(--m);padding:8px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#ts.s{opacity:1}#ts.e{background:var(--er);color:#fff}
</style>
</head>
<body>
<div id="app"></div>
<div id="ts"></div>
<script src="store-data.js"></script>

const st=(o,p,v)=>{const k=p.split('.'),l=k.pop();k.reduce((a,x)=>a[x]??(a[x]={}),o)[l]=v};

const ICONS=Object.keys(I);
const ic=(n,z=22)=>`<svg width="${z}" height="${z}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${I[n]||I.box}</svg>`;
const TYPES=[['shop','متجر عادي (سلة وشراء)'],['boost','خدمات زيادة (يُطلب رابط الحساب)'],['embed','تضمين مواقع'],['funded','حسابات ممولة']];
const DELIV=[[0,'رابط مستودع / منصة'],[1,'بيانات حساب / اعتماد'],[2,'ملف تنفيذي / سورس كود'],[3,'تنفيذ على رابط حساب العميل']];
const TABS=[['home','الرئيسية'],['site','الموقع والهوية'],['partner','الشريك'],['banners','البانرات'],['categories','الأقسام'],['products','المنتجات'],['embeds','التضمين'],['coupons','كوبونات'],['social','التواصل'],['users','المستخدمين'],['apis','إعدادات APIs'],['affiliates','المسوقين'],['orders','الطلبات']];
const baseCur=()=>{const e=Object.entries(D.rates).find(([,v])=>+v[0]==1);return e?e[0]:'SAR'};
const catName=id=>(D.categories.find(c=>c.id==id)||{}).ar||'—';
function toast(m,k=''){const e=$('#ts');e.textContent=m;e.className='s '+k;clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2200)}
function badge(){const b=$('#bdg');if(!b)return;b.className='bdg '+(dirty?'d':'k');b.textContent=dirty?'تعديلات غير منشورة':'منشور'}
function save(){dirty=true;try{localStorage.setItem('amx_draft',JSON.stringify(D));badge()}catch(e){toast('تعذّر حفظ المسودة','e')}}
let tm;const later=()=>{clearTimeout(tm);tm=setTimeout(save,300)};
function imgf(p,v){const d=String(v||'').startsWith('data:'),logo=/logo/.test(p);
return `<div class="imgf"><span class="thm">${v?`<img src="${esc(v)}" alt="">`:ic('box',20)}</span><input class="inp" dir="ltr" data-p="${p}" data-re="1" value="${d?'':esc(v)}" placeholder="${d?'صورة مرفوعة ✓':'https://… رابط الصورة'}"><label class="b b2 sm">رفع<input type="file" accept="image/*" hidden data-up="${p}" data-mx="${logo?512:900}" data-png="${logo?1:0}"></label>${v?`<button class="b bd2 sm" data-a="clr" data-p="${p}" title="حذف">✕</button>`:''}</div>`}
function imgsf(p,v){v=v||[];return `<div class="grid-imgs">${v.map((u,i)=>`<span class="thm"><img src="${esc(u)}"><button data-a="clr-img" data-p="${p}" data-i="${i}">✕</button></span>`).join('')}</div><label class="dropzone" ondragover="event.preventDefault()" ondrop="event.preventDefault();handleDrop(event,'${p}')"><input type="file" accept="image/*" multiple hidden data-up="${p}" data-mx="1200"><span>اسحب وأفلت الصور هنا أو اضغط للرفع (متعدد)</span></label>`}
function F(l,p,o={}){const v=g(D,p),t=o.t||'text',a=`data-p="${p}"${o.n?' data-n="1"':''}${o.re?' data-re="1"':''}`;let h;
if(t=='chk')return `<label class="chk"><input type="checkbox" ${a} ${v!==false&&v?'checked':''}> ${l}</label>`;
if(t=='area')h=`<textarea class="inp" rows="${o.r||3}" ${a}>${esc(v)}</textarea>`;
else if(t=='sel')h=`<select class="inp" ${a}>${o.o.map(([k,n])=>`<option value="${esc(k)}" ${k==v?'selected':''}>${esc(n)}</option>`).join('')}</select>`;
else if(t=='img')h=imgf(p,v);
else if(t=='imgs')h=imgsf(p,v);
else if(t=='col')h=`<input type="color" class="inp col" value="${esc(v||'#000000')}" ${a}>`;
else h=`<input class="inp" type="${t=='num'?'number':'text'}" ${t=='num'?'step="any"':''} value="${esc(v)}" ${o.d?'dir="ltr"':''} ${o.ph?`placeholder="${esc(o.ph)}"`:''} ${a}>`;
return `<div class="fld ${o.w?'w2':''}"><span>${l}</span>${h}</div>`}
const VIEW={
home(){const n=D.products.length;return `<div class="stats"><div class="stat"><b>${D.categories.length}</b><span>الأقسام</span></div><div class="stat"><b>${n}</b><span>المنتجات</span></div><div class="stat"><b>${D.embeds.length}</b><span>التضمين</span></div><div class="stat"><b>${D.banners.length}</b><span>البانرات</span></div><div class="stat"><b>${Object.keys(D.coupons).length}</b><span>الكوبونات</span></div></div>
<div class="card"><h2>نشر التعديلات</h2><div class="acts"><button class="b" data-a="pub">نشر الآن</button><button class="b b2" data-a="exp">نسخة احتياطية</button><label class="b b2">استيراد<input type="file" accept=".js,.json" hidden data-imp="1"></label></div></div>`},
site(){const s='site.';return `<div class="card"><h2>الهوية</h2><div class="g2">${F('الاسم 1',s+'n1',{d:1})}${F('الاسم 2',s+'n2',{d:1})}${F('الشعار',s+'logo',{t:'img',w:1})}${F('العنوان (عربي)',s+'sa')}${F('العنوان (إنجليزي)',s+'se',{d:1})}${F('الوصف',s+'desc',{t:'area',w:1})}</div></div>
<div class="card"><h2>الألوان</h2><div class="g3">${F('الأساسي',s+'col.g',{t:'col'})}${F('التمييز',s+'col.m',{t:'col'})}${F('الإطارات',s+'col.ac',{t:'col'})}</div></div>`},

banners(){const hs=[['#/','الرئيسية'],...D.categories.map(c=>['#/c/'+c.id,'قسم: '+c.ar])];

categories(){return `<div class="card"><h2>الأقسام</h2><button class="b" data-a="add" data-k="categories">+ قسم جديد</button></div>`+D.categories.map((c,i)=>{const k='categories.'+i+'.';return `<div class="card"><div class="g2">${F('الاسم (عربي)',k+'ar')}${F('الاسم (إنجليزي)',k+'en',{d:1})}${F('الوصف (عربي)',k+'da')}${F('الوصف (إنجليزي)',k+'de',{d:1})}${F('النوع',k+'ty',{t:'sel',o:TYPES,re:1})}${F('الأيقونة',k+'i',{t:'sel',o:ICONS.map(x=>[x,x]),re:1})}${F('صورة القسم',k+'image_url',{t:'img',w:1})}${F('رابط تضمين (iframe) للقسم',k+'embed_url',{d:1,w:1})}</div>${mv('categories',i)}</div>`}).join('')},
products(){

${D.embeds.map((e,i)=>`<div class="it"><div class="im"><b>${esc(e.ar)}</b><small dir="ltr">${esc(e.u)}</small></div><button class="b b2 sm" data-a="edit" data-i="${i}">تعديل</button><button class="b bd2 sm" data-a="del" data-k="embeds" data-i="${i}">حذف</button></div>`).join('')}</div>`},
users(){setTimeout(loadUsers,100);return `<div class="card"><h2>المستخدمين المسجلين</h2><div id="users-list">جارِ التحميل…</div></div>`},
apis(){setTimeout(loadApis,100);return `<div class="card"><h2>إعدادات الربط البرمجي (APIs)</h2><form id="api-form">
<div class="g2">${F('SMM API URL', 'api.smm_url', {d:1})}${F('SMM API Key', 'api.smm_key', {d:1})}${F('Payment Gateway (اسم البوابة)', 'api.payment_gateway', {d:1})}${F('Payment Public Key', 'api.payment_public_key', {d:1})}${F('Payment Secret Key', 'api.payment_secret_key', {d:1})}${F('AI Support API Key (مثال: OpenAI)', 'api.ai_api_key', {d:1})}</div>
${F('AI System Prompt (رسالة توجيه المساعد)', 'api.ai_system_prompt', {t:'area',w:1})}
<button class="b" data-a="save-api" type="button">حفظ الإعدادات</button></form></div>`},
affiliates(){setTimeout(loadAffiliates,100);return `<div class="card"><h2>المسوقين (Affiliates)</h2><div id="aff-list">جارِ التحميل…</div></div>`},
orders(){setTimeout(loadOrders,100);return `<div class="card"><h2>الطلبات</h2><div id="ob">جارِ التحميل…</div></div>`}
};
function mv(k,i){return `<div class="acts"><button class="b b2 sm" data-a="mv" data-k="${k}" data-i="${i}" data-d="-1">↑</button><button class="b b2 sm" data-a="mv" data-k="${k}" data-i="${i}" data-d="1">↓</button><button class="b bd2 sm" data-a="del" data-k="${k}" data-i="${i}">حذف</button></div>`}
function render(){
$('#app').innerHTML=`<header class="top"><div class="w tr"><b class="ttl">⚙ لوحة التحكم <small>${esc(D.site.n1+D.site.n2)}</small></b><span class="bdg" id="bdg"></span><span class="sp"></span><a class="b b2 sm" href="index.html" target="_blank">معاينة ↗</a><button class="b sm" data-a="pub">نشر الآن</button><button class="b b2 sm" data-a="logout">خروج</button></div></header><div class="w lay"><nav class="sd">${TABS.map(([k,n])=>`<button class="${tab==k?'on':''}" data-tab="${k}">${n}</button>`).join('')}</nav><main>${VIEW[tab]()}</main></div>`;badge();
if(tab=='apis')loadApis();
}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.p){let v=t.type=='checkbox'?t.checked:t.value;if(t.dataset.n||t.type=='number')v=v===''?0:+v;st(D,t.dataset.p,v);later()}else if(t.id=='pq'){pq=t.value;const p=t.selectionStart;render();const n=$('#pq');n.focus();n.setSelectionRange(p,p)}});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
if(d.up)return upl(t);if(d.imp)return imp(t);
if(d.p){let v=t.type=='checkbox'?t.checked:t.value;st(D,d.p,v);save();if(d.re)render();return}
});
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-tab]');if(!b)return;const d=b.dataset;
if(d.tab){tab=d.tab;ed=null;render();return}
const a=d.a;if(!a)return;
if(a=='logout'){try{localStorage.removeItem('amx_sb')}catch{}SES=null;return loginView()}
if(a=='back'){ed=null;return render()}
if(a=='edit'){ed=+d.i;return render()}
if(a=='clr'){st(D,d.p,'');save();return render()}
if(a=='clr-img'){D.products[ed].images.splice(+d.i,1);save();render();return}
if(a=='add'){const it=NEW[d.k]();if(d.k=='products'||d.k=='embeds'){D[d.k].unshift(it);ed=0}else D[d.k].push(it);save();return render()}
if(a=='mv'){const k=d.k,i=+d.i,j=i+ +d.d;if(j<0||j>=D[k].length)return;[D[k][i],D[k][j]]=[D[k][j],D[k][i]];save();render();return}
if(a=='del'){if(!confirm('تأكيد الحذف؟'))return;D[d.k].splice(+d.i,1);save();render();return}
if(a=='save-api'){saveApis();return}
if(a=='pub'){publish();return}
});
const NEW={
categories:()=>({id:'c'+uid(),ty:'shop',i:'box',ar:'قسم جديد',en:'New category',da:'',de:'',f:[],embed_url:'',image_url:''}),
products:()=>({id:'p'+uid(),c:(D.categories[0]||{}).id||'',ar:'منتج جديد',en:'New product',p:100,o:0,d:0,r:5,n:0,bs:0,t:0,tg:'',sp:'',ds:{ar:'',en:''},img:'',images:[]}),
embeds:()=>({id:'e'+uid(),c:(D.categories[0]||{}).id||'',ar:'عنوان',en:'Title',da:'',de:'',u:'https://',h:480}),
banners:()=>({ar:'عنوان',en:'Title',sa:'',se:'',h:'#/',img:''})};
const rd=(f,cb)=>{const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)};
function setimg(p,u){st(D,p,u);save();render()}
async function up(blob,ext,type){
  const name='img/'+uid()+'.'+ext;
  const r=await api('/storage/v1/object/store-media/'+name,{method:'POST',headers:{'Content-Type':type,'x-upsert':'true'},body:blob});
  if(!r.ok)throw new Error((await r.text()).slice(0,150));
  return SB_URL+'/storage/v1/object/public/store-media/'+name;
}
function upl(t){
  const files=t.files; if(!files.length)return;
  const p=t.dataset.up,mx=+t.dataset.mx||900;
  Array.from(files).forEach(f=>{
    const fail=e=>toast('فشل الرفع: '+e.message,'e');
    rd(f,u=>{const im=new Image();im.onload=()=>{
      const rr=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*rr);c.height=Math.round(im.height*rr);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      c.toBlob(b=>up(b,'jpg','image/jpeg').then(url=>{
        if(p.includes('images')){ if(!D.products[ed].images)D.products[ed].images=[]; D.products[ed].images.push(url); save(); render(); }
        else setimg(p,url);
      }).catch(fail),'image/jpeg',.82)
    };im.src=u})
  });
}
window.handleDrop=(e,p)=>{const f=e.dataTransfer.files[0];if(!f)return;const dt=new DataTransfer();dt.items.add(f);const inp=document.querySelector(`input[data-up="${p}"]`);inp.files=dt.files;upl(inp)};
const sget=()=>{try{return JSON.parse(localStorage.getItem('amx_sb'))}catch{return null}};
async function auth(body,grant){
  const r=await fetch(SB_URL+'/auth/v1/token?grant_type='+grant,{
    method:'POST',
    mode:'cors',
    headers:{apikey:SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  const j=await r.json();
  if(!r.ok)throw new Error(j.error_description||j.msg||'فشل');
  SES={access_token:j.access_token,refresh_token:j.refresh_token,exp:Math.floor(Date.now()/1e3)+(j.expires_in||3600),email:(j.user||{}).email};
  try{localStorage.setItem('amx_sb',JSON.stringify(SES))}catch{}
  return SES;
}
async function tok(){if(!SES)throw new Error('login');if(SES.exp-60<Date.now()/1e3)await auth({refresh_token:SES.refresh_token},'refresh_token');return SES.access_token}
async function api(path,o={}){const t=await tok();return fetch(SB_URL+path,{...o,mode:'cors',headers:{apikey:SB_KEY,Authorization:'Bearer '+t,...(o.headers||{})}})}
function loginView(msg=''){$('#app').innerHTML=`<div class="w" style="max-width:380px;margin-top:12vh"><form class="card" id="lf"><h2 style="text-align:center">⚙ لوحة التحكم</h2><div class="fld"><span>البريد</span><input class="inp" name="e" type="email" dir="ltr" required></div><div class="fld"><span>كلمة المرور</span><input class="inp" name="p" type="password" dir="ltr" required></div><p id="le" style="color:var(--er);font-size:12px">${esc(msg)}</p><button class="b" style="width:100%">دخول</button></form></div>`}
document.addEventListener('submit',async e=>{if(e.target.id!='lf')return;e.preventDefault();const f=new FormData(e.target),b=e.target.querySelector('.b');b.disabled=true;try{await auth({email:f.get('e').trim(),password:f.get('p')},'password');await boot()}catch(x){b.disabled=false;$('#le').textContent=x.message}});
async function loadCfg(){try{const r=await api('/rest/v1/store_config?id=eq.1&select=data');if(!r.ok)throw new Error();const row=(await r.json())[0];D=clone(row&&row.data&&Array.isArray(row.data.products)?row.data:PUB);dirty=!row}catch(e){D=clone(PUB);dirty=true}fix();}
async function publish(){if(!confirm('نشر التعديلات الآن؟'))return;D.ts=Date.now();try{const r=await api('/rest/v1/store_config',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:1,data:D,updated_at:new Date().toISOString()})});if(!r.ok)throw new Error((await r.text()).slice(0,200));dirty=false;toast('تم النشر')}catch(e){toast('فشل النشر','e')}}
async function loadApis(){
  try{
    const r=await api('/rest/v1/api_settings?id=eq.1&select=*');
    const d=(await r.json())[0]||{};
    D.api={smm_url:d.smm_api_url||'',smm_key:d.smm_api_key||'',payment_gateway:d.payment_gateway||'',payment_public_key:d.payment_public_key||'',payment_secret_key:d.payment_secret_key||'',ai_api_key:d.ai_api_key||'',ai_system_prompt:d.ai_system_prompt||''};
    if(tab=='apis')render();
  }catch{}
}
async function saveApis(){
  const d=D.api||{};
  try{
    const r=await api('/rest/v1/api_settings',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:1,smm_api_url:d.smm_url,smm_api_key:d.smm_key,payment_gateway:d.payment_gateway,payment_public_key:d.payment_public_key,payment_secret_key:d.payment_secret_key,ai_api_key:d.ai_api_key,ai_system_prompt:d.ai_system_prompt})});
    if(!r.ok)throw new Error();
    toast('تم حفظ الإعدادات');
  }catch{toast('فشل الحفظ','e')}
}
async function loadUsers(){
  const b=$('#users-list');if(!b)return;
  try{
    const r=await api('/rest/v1/profiles?select=*,orders(id,total,created_at)&order=created_at.desc');
    const u=await r.json();
    b.innerHTML=`<table class="tb"><tr><th>الاسم</th><th>البريد</th><th>الطلبات</th><th>الإجمالي</th><th>الحالة</th></tr>${u.map(x=>`<tr><td>${esc(x.full_name||'—')}</td><td dir="ltr">${esc(x.email)}</td><td>${(x.orders||[]).length}</td><td>${(x.orders||[]).reduce((s,o)=>s+ +o.total,0).toFixed(2)}</td><td>${(x.orders||[]).length?'<span style="color:var(--lk)">أتم طلبات</span>':'<span style="color:#FBBF24">لا يوجد طلب</span>'}</td></tr>`).join('')}</table>`;
  }catch{b.textContent='فشل التحميل'}
}
async function loadAffiliates(){
  const b=$('#aff-list');if(!b)return;
  try{
    const r=await api('/rest/v1/affiliates?select=*,profiles(email)');
    const a=await r.json();
    b.innerHTML=`<table class="tb"><tr><th>المسوق</th><th>النقرات</th><th>المبيعات</th><th>العمولة</th></tr>${a.map(x=>`<tr><td dir="ltr">${esc((x.profiles||{}).email||x.user_id)}</td><td>${x.clicks}</td><td>${x.sales}</td><td>${(+x.total_commission).toFixed(2)}</td></tr>`).join('')}</table>`;
  }catch{b.textContent='فشل التحميل'}
}
async function loadOrders(){
  const b=$('#ob');if(!b)return;
  try{const r=await api('/rest/v1/orders?select=*&order=created_at.desc&limit=100');const o=await r.json();
  b.innerHTML=o.map(x=>`<div class="it"><div class="im"><b>${esc(x.customer_name||'—')}</b><small dir="ltr">${esc(x.id)} · ${(+x.total).toFixed(2)} ${esc(x.affiliate_ref?' (Ref:'+x.affiliate_ref+')':'')}</small></div><select class="inp" style="width:auto;min-height:32px" data-ost="${esc(x.id)}">${[['new','جديد'],['done','مكتمل']].map(([k,n])=>`<option value="${k}" ${x.status==k?'selected':''}>${n}</option>`).join('')}</select></div>`).join('');
  }catch{b.textContent='فشل التحميل'}
}
document.addEventListener('change',e=>{if(e.target.dataset.ost){api('/rest/v1/orders?id=eq.'+e.target.dataset.ost,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:e.target.value})}).then(()=>toast('تم التحديث'))}});
async function boot(){SES=sget();if(SES){try{await tok()}catch{SES=null}}if(!SES)return loginView();await loadCfg();render()}
boot();
</script>
</body>
</html>
