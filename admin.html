<title>لوحة التحكم | Amarix</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#161a23;--mut:#6b7280;--br:#e5e7eb;--pri:#6d5dfc;--ok:#16a34a;--bad:#dc2626}
:root[data-theme=dark]{--bg:#0e1118;--card:#171b26;--tx:#eef0f6;--mut:#98a0b3;--br:#262c3b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,Tahoma,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--br);padding:8px 12px;z-index:5}
nav{display:flex;gap:6px;overflow-x:auto}main{max-width:1000px;margin:0 auto;padding:12px}
button{font:inherit;background:var(--pri);color:#fff;border:0;border-radius:8px;padding:6px 11px;cursor:pointer;margin:2px}button.sec{background:var(--card);color:var(--tx);border:1px solid var(--br)}button.on{background:var(--tx);color:var(--bg)}
input,select{font:inherit;color:inherit;padding:8px;border:1px solid var(--br);border-radius:8px;background:var(--card);margin:2px;max-width:100%}
.card{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:10px;margin-bottom:8px}.mut{color:var(--mut);font-size:13px}.row{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
#toast{position:fixed;bottom:16px;inset-inline:16px;background:#111;color:#fff;padding:12px;border-radius:12px;display:none;text-align:center;z-index:9}
</style>
</head>
<body data-admin="1">
<header><nav id="tabs"></nav></header>
<main id="app">جارٍ التحميل…</main>
<div id="toast"></div>
<script src="app.js"></script>
<script src="admin.js"></script>
</body>
</html>
