<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.supabase.co; connect-src https://pvuobngrybygohendwaz.supabase.co; base-uri 'none'; form-action 'none'">
<title>Amarix | متجر الخدمات الرقمية</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#161a23;--mut:#6b7280;--br:#e5e7eb;--pri:#6d5dfc;--ok:#16a34a;--bad:#dc2626}
:root[data-theme=dark]{--bg:#0e1118;--card:#171b26;--tx:#eef0f6;--mut:#98a0b3;--br:#262c3b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,"Segoe UI",Tahoma,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--br)}
header a.brand{font-weight:800;color:var(--pri);text-decoration:none;margin-inline-end:auto;font-size:20px}
main{max-width:900px;margin:0 auto;padding:14px}
button,select,input{font:inherit;color:inherit}
button,.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:9px 14px;cursor:pointer}
button.sec{background:var(--card);color:var(--tx);border:1px solid var(--br)}
input,select{width:100%;padding:10px;border:1px solid var(--br);border-radius:10px;background:var(--card);margin:4px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:14px}
.cat{text-align:center;text-decoration:none;color:inherit;font-weight:700}.cat span{display:block;font-size:34px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.chip{white-space:nowrap;background:var(--card);color:var(--tx);border:1px solid var(--br);padding:5px 12px;border-radius:99px}.chip.on{background:var(--pri);color:#fff}
.badge{font-size:12px;background:#6d5dfc22;color:var(--pri);padding:1px 8px;border-radius:99px;margin-inline-end:4px}
.mut{color:var(--mut);font-size:14px}.price{font-weight:800;font-size:18px}
.st-completed{color:var(--ok)}.st-failed{color:var(--bad)}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));inset-inline:16px;background:#111;color:#fff;padding:12px;border-radius:12px;display:none;text-align:center;z-index:9}
</style>
</head>
<body>
<header>
  <a class="brand" href="#/">Amarix</a>
  <select id="cur" style="width:auto;margin:0" aria-label="العملة"></select>
  <button class="sec" id="theme" aria-label="الوضع">🌓</button>
  <button id="acct">دخول</button>
</header>
<main id="app">جارٍ التحميل…</main>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
