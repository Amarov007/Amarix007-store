const it=[['','home','home'],['fav','heart','fav'],['cart','cart','cart'],['orders','box','ord'],['account','user','acc']];
v.innerHTML=it.map(([l,i,k])=>`<a href="#/${l}" data-r="${l}">${ic(i,20)}<span>${t(k)}</span>${k=='cart'?'<span class="cnt">'+n+'</span>':''}</a>`).join('');
v.querySelectorAll('a').forEach(e=>e.classList.toggle('on',e.dataset.r==a));}

function home(){if(q)return `<h2>${t('all')}</h2>`+grid(P.filter(p=>hit(p,q)));
return partner()+`<div class="ban">${BN.map(b=>`<div${b.img?` style="background:linear-gradient(135deg,rgba(0,0,0,.6),rgba(0,0,0,.35)),url('${ex(b.img)}') center/cover"`:''}><h3>${b[lang]}</h3><p>${lang=='ar'?b.sa:b.se}</p><a class="b" href="${b.h}" style="display:inline-block">${ic('bolt',14)} ${t('all')}</a></div>`).join('')}</div>
<div class="tiles" style="margin-top:14px">${C.map(c=>`<a class="ct" href="#/c/${c.id}"><span class="tile">${ico(c,20)}</span><span><b>${c[lang]}</b></span></a>`).join('')}</div>
<h2>${t('all')}</h2>${grid(P)}`}

const partner=()=>{const p=CFG.partner||{},A=lang=='ar';if(p.on===false||!p.url)return'';return `<a class="pt" href="${ex(p.url)}" target="_blank" rel="noopener"><div class="pt-bg" style="${p.banner_bg_url?`background-image:url('${ex(p.banner_bg_url)}')`:''}"></div><div class="pt-content"><span class="tile big">${p.logo?`<img src="${ex(p.logo)}">`:ic('bank')}</span><span class="pc"><b class="n pnm">${ex(p.name)}</b><span class="pd">${ex(A?p.ar:p.en)}</span></span><span class="b pbtn">${ex(A?p.ba:p.be)}</span></div></a>`};
const ico=(o,z)=>o.image_url?`<img src="${ex(o.image_url)}">`:ic(o.i||'box',z);

function catPage(id){const c=cat(id);if(!c)return home();
if(c.embed_url)return `<div class="box"><h1>${c[lang]}</h1><p class="pd">${lang=='ar'?c.da:c.de}</p><iframe src="${ex(c.embed_url)}" style="width:100%;height:500px;border:0;border-radius:12px"></iframe></div>`;
return `<div class="box row"><span class="tile big">${ico(c,30)}</span><div style="flex:1"><h1>${c[lang]}</h1><p class="pd">${lang=='ar'?c.da:c.de}</p></div></div>${grid(P.filter(p=>p.c==id))}`}

function prodPage(id){const p=prod(id);if(!p)return home();const c=cat(p.c),o=p.o>pr(p)?`<s>${money(p.o)}</s>`:'',imgs=[p.img,...(p.images||[])].filter(Boolean);
return `<div class="box"><div class="gallery">${imgs.length?`<div class="main-img"><img src="${ex(imgs[0])}" id="main-img"></div><div class="thumbs">${imgs.map((u,i)=>`<img src="${ex(u)}" class="${i?'':'on'}" onclick="document.getElementById('main-img').src=this.src;document.querySelectorAll('.thumbs img').forEach(x=>x.classList.remove('on'));this.classList.add('on')">`).join('')}</div>`:`<span class="tile big">${ico(c,30)}</span>`}</div>
<h1>${p[lang]}</h1><div class="pr"><b class="n">${money(pr(p))}</b>${o}</div>
<div class="row"><button class="b" style="flex:1" data-a="buy" data-id="${p.id}">${t('buy')}</button><button class="b b2" style="flex:1" data-a="add" data-id="${p.id}">${t('add')}</button></div></div>
${p.ds&&p.ds[lang]?`<div class="box"><p class="pd">${ex(p.ds[lang])}</p></div>`:''}`}

function cartPage(){if(!cart.length)return `<p class="emp">${t('ce')}</p>`;const sub=cart.reduce((s,x)=>s+pr(prod(x.id))*x.q,0);
return cart.map(x=>{const p=prod(x.id);return `<div class="box row"><div style="flex:1"><b>${p[lang]}</b><div class="n">${money(pr(p))}</div>${cat(p.c).ty=='boost'?`<input class="inp" style="margin-top:6px;width:100%" data-a="lk" data-id="${p.id}" value="${ex(x.l||'')}" placeholder="رابط الحساب">`:''}</div><span class="q"><button data-a="q" data-id="${p.id}" data-d="-1">−</button><b class="n">${x.q}</b><button data-a="q" data-id="${p.id}" data-d="1">+</button></span><button class="ib" data-a="rm" data-id="${p.id}">✕</button></div>`}).join('')+
`<div class="box"><div class="row tot"><span>${t('sub')}</span><b class="n">${money(sub)}</b></div><button class="b" style="width:100%" data-a="co">${t('co')}</button></div>`}

function authPage(){const up=window.regMode;
window.capA = Math.floor(Math.random()*10)+1; window.capB = Math.floor(Math.random()*10)+1;
return `<form class="box au" id="af"><h2 style="text-align:center">${up?t('reg'):t('login')}</h2>
${up?`<label class="fld"><span>${t('nl')}</span><input class="inp" name="n" required></label>`:''}
<label class="fld"><span>${t('em')}</span><input class="inp" name="e" type="email" dir="ltr" required></label>
<label class="fld"><span>${t('pw')}</span><div class="pw"><input class="inp" name="p" type="password" id="pw-input" required></div>${up?`<div class="strength-bar"><div id="pw-fill"></div></div><small id="pw-text" style="font-size:11px"></small>`:''}</label>
<label class="fld"><span>تحقق بشري: ${window.capA} + ${window.capB} = ؟</span><input class="inp" name="cap" type="number" required></label>
<p id="er" style="color:var(--er);font-size:12px"></p>
<button class="b" style="width:100%" type="submit">${up?t('reg'):t('login')}</button>
<a href="#" data-a="toggle-mode" style="display:block;text-align:center;margin-top:10px;font-size:12px">${up?t('has'):t('no')}</a></form>`}

function accPage(){return `<div class="box row" style="justify-content:flex-start;gap:14px"><span class="tile big"><b class="n" style="font-size:26px">${esc([...user.email][0]||'U')}</b></span><div style="min-width:0"><h1 style="font-size:18px">${t('wel')}</h1><bdi dir="ltr" class="sb">${esc(user.email)}</bdi></div></div>
<a class="box row" href="#/orders" style="display:flex"><span>${t('ord')}</span>${ic('box',18)}</a><button class="b b2" style="width:100%" data-a="out">${t('out')}</button>`}
function ordPage(){return `<p class="emp">${t('none')}</p>`}
function favPage(){const a=P.filter(p=>fav.includes(p.id));return a.length?grid(a):`<p class="emp">${ic('heart',40)}<br>${t('none')}</p>`}

document.addEventListener('input', e => {
  if(e.target.id == 'pw-input') {
    const val = e.target.value, fill = document.getElementById('pw-fill'), text = document.getElementById('pw-text');
    if(!fill) return; let score = 0;
    if(val.length >= 8) score++; if(/[A-Z]/.test(val)) score++; if(/[0-9]/.test(val)) score++; if(/[^A-Za-z0-9]/.test(val)) score++;
    if(score <= 1) { fill.style.width = '25%'; fill.style.background = '#ef4444'; text.textContent = 'ضعيفة'; text.style.color = '#ef4444'; }
    else if(score == 2) { fill.style.width = '50%'; fill.style.background = '#FBBF24'; text.textContent = 'متوسطة'; text.style.color = '#FBBF24'; }
    else if(score == 3) { fill.style.width = '75%'; fill.style.background = '#3b82f6'; text.textContent = 'جيدة'; text.style.color = '#3b82f6'; }
    else { fill.style.width = '100%'; fill.style.background = '#22c55e'; text.textContent = 'قوية'; text.style.color = '#22c55e'; }
  }
});

function render(){const[h]=(location.hash||'#/').split('?'),[,r,id]=h.split('/');
if(['orders','account'].includes(r)&&!user)return location.hash='#/login';
$('#m').innerHTML=r=='c'?catPage(id):r=='p'?prodPage(id):r=='cart'?cartPage():r=='fav'?favPage():r=='login'?authPage():r=='account'?accPage():home();nav()}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  if(a=='add'){const x=cart.find(c=>c.id==id);x?x.q++:cart.push({id,q:1});save();nav();toast('أضيف')}
  else if(a=='fav'){fav=fav.includes(id)?fav.filter(x=>x!=id):[...fav,id];save();render();}
  else if(a=='buy'){const x=cart.find(c=>c.id==id);x?x.q++:cart.push({id,q:1});save();location.hash='#/cart'}
  else if(a=='q'){const x=cart.find(c=>c.id==id);x.q+=+b.dataset.d;if(x.q<1)cart=cart.filter(c=>c.id!=id);save();render()}
  else if(a=='rm'){cart=cart.filter(c=>c.id!=id);save();render()}
  else if(a=='co'){
    if(!user){toast(t('lreq'));location.hash='#/login';return}
    const sub=cart.reduce((s,x)=>s+pr(prod(x.id))*x.q,0);
    const oid='AMX-'+Date.now().toString(36).toUpperCase();
    try{
      await fetch(SB_URL+'/rest/v1/orders',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({id:oid,customer_name:user.email,customer_email:user.email,items:cart.map(x=>{const p=prod(x.id);return{id:x.id,name:p[lang],q:x.q,link:x.l||'',price:pr(p)}}),total:sub,lang})});
      cart=[];save();toast('تم الطلب');location.hash='#/'; 
    }catch(err){toast('فشل الطلب')}
  }
  else if(a=='out'){await fetch(SB_URL+'/auth/v1/logout',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+localStorage.getItem('amx_token')}});localStorage.removeItem('amx_token');localStorage.removeItem('amx_user');user=null;render()}
  else if(a=='lang'){lang=lang=='ar'?'en':'ar';save();head();render()}
  else if(a=='cur'){cur=b.value;save();render()}
  else if(a=='toggle-mode'){e.preventDefault();window.regMode=!window.regMode;render()}
});

document.addEventListener('submit',async e=>{
  if(e.target.id!='af')return;e.preventDefault();const f=new FormData(e.target),er=$('#er');
  if(+f.get('cap')!==window.capA+window.capB){er.textContent='خطأ في الكابتشا';return}
  const em=f.get('e').trim(),pw=f.get('p');
  try{
    const ep=window.regMode?'/auth/v1/signup':'/auth/v1/token?grant_type=password';
    const r=await fetch(SB_URL+ep,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw})});
    const j=await r.json();if(!r.ok)throw new Error(j.msg||j.error_description);
    if(!window.regMode){
      localStorage.setItem('amx_token',j.access_token);localStorage.setItem('amx_user',JSON.stringify(j.user));user=j.user;toast('مرحباً');location.hash='#/';
    } else {toast('تم التسجيل، يرجى الدخول');window.regMode=false;render()}
  }catch(err){er.textContent=err.message}
});

const nz=x=>String(x).toLowerCase().replace(/[ً-ٟ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
const hit=(p,k)=>{const h=nz(p.ar+' '+p.en+' '+p.tg+' '+p.sp);return nz(k).split(/\s+/).filter(Boolean).every(w=>h.includes(w))};
let q='';$('#q').addEventListener('input',e=>{q=e.target.value;if((location.hash||'#/')=='#/')render()});

addEventListener('hashchange',()=>{scrollTo(0,0);render()});

async function boot(){
  const u=localStorage.getItem('amx_user');if(u){try{user=JSON.parse(u)}catch{}}
  try{const r=await fetch(SB_URL+'/rest/v1/api_settings?id=eq.1&select=*',{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});const d=(await r.json())[0];if(d)API_SETTINGS=d;}catch{}
  try{const r=await fetch(SB_URL+'/rest/v1/store_config?id=eq.1&select=data',{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});const d=((await r.json())[0]||{}).data;if(d&&Array.isArray(d.products)&&d.ts!==CFG.ts)setCfg(d);}catch{}
  head();render();
}
boot();
</script>
</body>
</html>
